[Specification]
location = "/ros2_ws/src/RTLola-ROS2-Adapter_pkg/specs/cargopack.lola"

# allows to freeze, i.e., disables build.rs
[GenerateFlag]
generate = false

# location of the local ros2 setup that shall be used to get message interface information e.g. "/root/repos/DLR/tester/install/setup.bash"
[LocalSetupScript]
local_setup_script = [  "/ros2_ws/install/setup.bash" ]

# Quality of service
[QoS_Default]
history = "KeepLast"                            # Options: KeepAll, KeepLast, SystemDefault, Unknown
depth = 10                                      # integer for queue size
reliability = "Reliable"                        # Options: BestEffort, Reliable, SystemDefault
durability = "Volatile"                         # Options: TransientLocal, Volatile, SystemDefault, Unknown
deadline_ms = 0                             # in milliseconds
lifespan_ms = 0                             # in milliseconds
liveliness = "Automatic"                        # Options: Automatic, ManualByTopic, SystemDefault, Unknown
liveliness_lease_duration_ms = 0            # in milliseconds
avoid_ros_namespace_conventions = false         # set to false to use ROS prefix and true to not using ROS namespace prefixing

[QoS_RTLolaOutput] 
history = "KeepLast"                            # Options: KeepAll, KeepLast, SystemDefault, Unknown
depth = 10                                      # integer for queue size
reliability = "Reliable"                        # Options: BestEffort, Reliable, SystemDefault
durability = "Volatile"                         # Options: TransientLocal, Volatile, SystemDefault, Unknown
deadline_ms = 0                             # in milliseconds
lifespan_ms = 0                             # in milliseconds
liveliness = "Automatic"                        # Options: Automatic, ManualByTopic, SystemDefault, Unknown
liveliness_lease_duration_ms = 0            # in milliseconds
avoid_ros_namespace_conventions = false         # set to false to use ROS prefix and true to not using ROS namespace prefixing

[QoS_RTLolaService]
history = "KeepLast"                            # Options: KeepAll, KeepLast, SystemDefault, Unknown
depth = 10                                      # integer for queue size
reliability = "Reliable"                        # Options: BestEffort, Reliable, SystemDefault
durability = "Volatile"                         # Options: TransientLocal, Volatile, SystemDefault, Unknown
deadline_ms = 0                                 # in milliseconds
lifespan_ms = 0                                 # in milliseconds
liveliness = "SystemDefault"                    # Options: Automatic, ManualByTopic, SystemDefault, Unknown
liveliness_lease_duration_ms = 0                # in milliseconds
avoid_ros_namespace_conventions = false         # set to false to use ROS prefix and true to not using ROS namespace prefixing

# Topic messages that should be ignored
# Acts as a de-facto whitelist: everything incompatible with the adapter's
# primitive-only type support (bool/float/int, no Header/string/nested/array
# fields), or the topic/type/package-naming convention it hardcodes in
# templates/t_ros2_handler.rs ("rtlola_testnode" package, topic name == type
# name), is excluded here. Currently zero topics pass until a dedicated
# translator node + rtlola_testnode interfaces package exist.
[Blacklist]
topics = [
  "rcl_interfaces/msg/ParameterEvent", "rcl_interfaces/msg/Log",  # default ROS housekeeping
  "mavros",                                   # all /mavros/* topics + mavros_msgs/msg/Mavlink (uas1/*)
  "zoom_goal", "reset_operator", "offboard_keep_mode",  # pass the type filter but hit the naming/package bug
  "diagnostic_msgs",                          # /diagnostics
  "rosbag2_interfaces",                       # /events/read_split, /events/write_split
  "tf2_msgs",                                 # /tf, /tf_static
  "move_base_simple",                         # /move_base_simple/goal
  "std_msgs/msg/String",                      # /GimbalFSM/state, /Gremsy_VIO/gimbal_att_reset, /Gremsy_VIO/src, /LED/*
  "Vector3Stamped",                           # /Gremsy_VIO/gimbal_target_vel (has Header)
  "sensor_msgs/msg/Image",                    # /VisionTRT/image/cpu
  "NitrosBridgeImage",                        # /VisionTRT/image/gpu
  "PointCloud2",                              # /VisionTRT/operator_keypoints_3d
  "visualization_msgs",                       # /VisionTRT/operator_skeleton_3d
  "cargopack_interfaces/msg/VioState",        # /Gremsy_VIO/state (Header, strings, nested Vector3)
  "cargopack_interfaces/msg/VisionData",      # /VisionTRT/status (Header, strings, unbounded arrays)
]

# Location where the generated files shall be located
[Destination]
path = "src_generated/"
